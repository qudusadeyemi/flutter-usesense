name: usesense_flutter_example
description: Demonstrates the UseSense Flutter plugin.
publish_to: none

environment:
  # The Dart lower bound sets the formatter's language version, so it stays at
  # 3.2 (raising it reformats the example). material_ui itself requires Dart
  # 3.13 / Flutter 3.47+, which the flutter constraint below states.
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47+ deprecates package:flutter/material.dart in favour of this
  # package.
  material_ui: ^1.11.0
  usesense_flutter:
    path: ../
  # Persists the user-entered API key across launches, matching the
  # iOS example's @AppStorage and Android example's SharedPreferences
  # pattern. Only the example app needs this dep; the plugin itself
  # has no runtime state to persist.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
